name: Module Version Compatibility CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  module-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with: {persist-credentials: false}
      - uses: hashicorp/setup-terraform@v4
        with: {terraform_version: "~> 1.9", terraform_wrapper: false}
      - uses: actions/setup-python@v6
        with: {python-version: "3.12"}
      - run: terraform fmt -check -recursive modules examples
      - run: python scripts/check_contracts.py
      - run: python -m unittest discover -s tests -v
      - run: |
          for d in examples/consumer_v1 examples/consumer_v1_1 examples/consumer_v2; do
            terraform -chdir="$d" init -backend=false -input=false
            terraform -chdir="$d" validate
            terraform -chdir="$d" test
          done
      - run: python scripts/check_repository.py
